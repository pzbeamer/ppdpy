name: CI

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_fast.py

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libomp-dev libopenvdb-dev libtbb-dev libboost-dev \
                                  libcgal-dev libgmp-dev libmpfr-dev
      - run: pip install -e ".[all,test]"
      - name: Build PPD + ESES
        run: CC=clang CXX=clang++ ppd build-backend
      - run: ppd doctor
      - run: pytest -q
